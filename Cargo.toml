[package]
name = "myuri-rs"
version = "5.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Rust port of Myuri (JWriter20/Myuri) and cursory mouse trajectory factory"
repository = "https://github.com/2noScript/myuri-rs"
homepage = "https://github.com/2noScript/myuri-rs"
readme = "README.md"
keywords = ["playwright", "humanize", "mouse", "anti-detection", "automation"]
categories = ["web-programming", "simulation"]

[features]
default = ["playwright"]
playwright = ["dep:playwright-rs"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
flate2 = "1"
getrandom = "0.3"
playwright-rs = { version = "0.21", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
